<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia das perguntas</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061410}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style><iframe src="../../index.html" title="Perguntas do BOITATÁ"></iframe><script>
document.querySelector('iframe').onload=e=>{
 const w=e.target.contentWindow,B=w.Boitata,s=B.S,params=new URLSearchParams(location.search);w.requestAnimationFrame=()=>0;
 B.Store.write=()=>true;s.save=B.Store.defaults();s.save.unlocked=10;
 if(params.has('final')){B.Game.start(10);B.Game.play();s.snake=s.oldSnake=[{x:21,y:4}];B.NetworkCollapse.update(.016);B.NetworkCollapse.update(4);}
 else{B.Game.start(4);B.Game.play();s.phase='quiz';B.Education.choose(params.get('theme')||'Switch');B.UI.quiz();}
 B.Renderer.draw(0);document.body.dataset.ready='true';
};
</script></html>
