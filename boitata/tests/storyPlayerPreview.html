<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia do reprodutor da História</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061410}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style><iframe allowfullscreen src="../../index.html" title="História do BOITATÁ"></iframe><script>
document.querySelector('iframe').onload=async e=>{
 const w=e.target.contentWindow,B=w.Boitata,H=B.Story,params=new URLSearchParams(location.search);w.requestAnimationFrame=()=>0;
 w.addEventListener('error',event=>document.body.dataset.error=event.message);w.addEventListener('unhandledrejection',event=>document.body.dataset.error=String(event.reason));
 if(params.has('audio'))B.S.save.audio={music:true,effects:true};
 if(!await H.start({manual:true})){document.body.dataset.error=H.error;return;}
 H.seekTo(Number(params.get('time')||72));H.setPlaybackRate(Number(params.get('rate')||1));H.pause();
 if(params.has('menu'))H.setSpeedMenu(true);
 document.body.dataset.ready='true';
};
</script></html>
